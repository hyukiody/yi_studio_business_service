name: Business Service CI & Prisma Drift Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: business-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-and-build:
    name: Prisma Schema Drift, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci_prisma_user
          POSTGRES_PASSWORD: ci_prisma_password
          POSTGRES_DB: yi_studio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_prisma_user -d yi_studio_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://ci_prisma_user:ci_prisma_password@localhost:5432/yi_studio_ci?schema=public
      DIRECT_URL: postgresql://ci_prisma_user:ci_prisma_password@localhost:5432/yi_studio_ci?schema=public
      UPSTASH_REDIS_REST_URL: https://ci-placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci_placeholder_token
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Validate and check formatting of Prisma schema
        run: |
          npx prisma validate
          npx prisma format --check

      - name: Verify committed migrations directory exists
        run: |
          if [ ! -d "prisma/migrations" ]; then
            echo "::error::Missing prisma/migrations directory. Baseline migrations via 'npx prisma migrate dev --name init' before merging."
            exit 1
          fi

      - name: Replay migrations and enforce zero schema drift
        run: |
          npx prisma migrate deploy
          set +e
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
          DIFF_EXIT=$?
          set -e
          if [ "$DIFF_EXIT" -eq 2 ]; then
            echo "::error::Prisma schema drift detected: prisma/schema.prisma does not match prisma/migrations."
            npx prisma migrate diff \
              --from-url "$DATABASE_URL" \
              --to-schema-datamodel prisma/schema.prisma \
              --script
            exit 1
          elif [ "$DIFF_EXIT" -ne 0 ]; then
            echo "::error::prisma migrate diff failed with exit code $DIFF_EXIT."
            exit "$DIFF_EXIT"
          fi

      - name: Generate Prisma client and check for tracked drift
        run: |
          npx prisma generate
          DRIFT="$(git status --porcelain)"
          if [ -n "$DRIFT" ]; then
            echo "::error::Tracked files mutated during prisma generate:"
            echo "$DRIFT"
            git diff
            exit 1
          fi

      - name: Run TypeScript typecheck and linter
        run: |
          npx tsc --noEmit
          npm run lint --if-present

      - name: Build Next.js application
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: https://yi-studio.example.com
        run: npm run build

  security:
    runs-on: ubuntu-latest
    name: Security Audit

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: NPM audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Production
    needs: [schema-and-build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.PRODUCTION_URL }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/standalone

      - name: Notify deployment
        run: echo "✅ Deploy artifacts ready (manual deployment step)"
